<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melvor Idle 2 Item Database</title>
  <meta name="description" content="Every Melvor Idle 2 item with real filters: 1H/2H, slot, style, level, stats, where it drops and what it is used for. Built from the game's own data.">
  <link rel="stylesheet" href="style.css?v=10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e0b45c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3 20 8v8l-8 5-8-5V8Z'/%3E%3Cpath d='M12 3v18M4 8l8 5 8-5'/%3E%3C/svg%3E">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/items">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 20 8v8l-8 5-8-5V8Z"/><path d="M12 3v18M4 8l8 5 8-5"/></svg>
      <span>Melvor Idle 2 Database<small>Items · Drops · Monsters</small></span>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#/items" data-nav="items">Items</a>
      <a href="#/monsters" data-nav="monsters">Monsters</a>
      <a href="#/areas" data-nav="areas">Areas</a>
      <a href="../">Modding wiki</a>
    </nav>
    <div class="jump" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="jump" type="search" placeholder="Jump to an item, monster or area" aria-label="Jump to an item, monster or area" autocomplete="off" aria-controls="jump-list" aria-expanded="false">
      <kbd>/</kbd>
      <div id="jump-list" class="jump-list" role="listbox" hidden></div>
    </div>
  </header>
  <main id="app" tabindex="-1"><p class="empty">Loading the database…</p></main>
  <div id="shade" class="panel-shade"></div>
  <aside id="panel" class="panel" aria-label="Item details" aria-hidden="true"></aside>
  <aside id="drawer" class="drawer" aria-label="More filters" aria-hidden="true"></aside>
  <div id="tray" class="tray" hidden></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <script type="module" src="app.js?v=10"></script>
</body>
</html>
